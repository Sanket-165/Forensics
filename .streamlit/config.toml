[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#131e32"
textColor = "#e5edf8"
font = "sans serif"

[server]
address = "127.0.0.1"
maxUploadSize = 15
headless = true
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
